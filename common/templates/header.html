{% if user.is_authenticated %}
<header class="app-topbar">
    <a href="{% url 'profile' %}" class="app-topbar-brand">Финансы</a>
    <div class="app-topbar-meta">
        <span class="app-topbar-user">{{ user.username }}</span>
        <a href="{% url 'logout' %}" class="app-topbar-logout">Выйти</a>
    </div>
</header>
{% endif %}
