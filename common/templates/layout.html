{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/material_icons.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>

    {% block head %}{% endblock %}
    <title>{% block title %}Финансы{% endblock %}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block chrome %}
        {% include "header.html" %}
    {% endblock %}

    <div class="content {% block content_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>
</body>

{% block scripts %}{% endblock %}
</html>
