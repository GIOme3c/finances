{% extends 'layout.html' %}
{% load material_icons %}

{% block content %}
    <h2>{{ user.username }}</h2>

    <div class="d-flex justify-content-center">
        {% url 'project-create' as create_project%}
        {% material_icon_button  'add' 'btn-success' create_project %}
    </div>

    <div class="d-flex flex-column">
        {% for project in  projects %}
            <button class="btn btn-info"> {{ project.project.name }}</button>
            
        {% endfor %}
    </div>
    

{% endblock %}
